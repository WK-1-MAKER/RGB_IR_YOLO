# YOLOv8 dual-stream RGB/IR object detection with AIFI-style P5 Transformer fusion.

nc: 80
depth_multiple: 0.33
width_multiple: 0.50
ch: 3

backbone:
  # [from, repeats, module, args]
  ######### Stream Features To P3 #############
  # stream one
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  # stream two
  - [-4, 1, Conv, [64, 3, 2]] # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 6-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 8-P3/8
  - [-1, 6, C2f, [256, True]]

  ######### Stream Features To P4 #############
  # stream one
  - [4, 1, Conv, [512, 3, 2]] # 10-P4/16
  - [-1, 6, C2f, [512, True]]
  # stream two
  - [9, 1, Conv, [512, 3, 2]] # 12-P4/16
  - [-1, 6, C2f, [512, True]]

  ######### Stream Features To P5 #############
  # stream one
  - [11, 1, Conv, [1024, 3, 2]] # 14-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 16
  # stream two
  - [13, 1, Conv, [1024, 3, 2]] # 17-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 19

  ######### P5 8x8 Transformer Fusion #############
  - [[16,19], 1, CrossModalDecoder, [1024, 1]]   # 20-P5/32 deltas, n_layer=1, avgpool=True
  - [20, 1, Select, [0]]                         # 21-P5/32 stream one
  - [20, 1, Select, [1]]                         # 22-P5/32 stream two

  ######### Add Block #############
  - [[4,9], 1, Add, [1]]   # 23-P3/8 fusion backbone P3
  - [[11,13], 1, Add, [1]]   # 24-P4/16 fusion backbone P4
  - [[21,22], 1, Add, [1]]   # 25-P5/32 fusion backbone P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 24], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 28

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 23], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 31 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 34 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 37 (P5/32-large)

  - [[31, 34, 37], 1, Detect, [nc]] # Detect(P3, P4, P5)
