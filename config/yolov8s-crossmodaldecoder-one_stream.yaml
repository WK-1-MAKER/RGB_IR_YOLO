# Shared-batch RGB/IR backbone with the original cross-modal decoder and detection head.

nc: 80
depth_multiple: 0.33
width_multiple: 0.50
ch: 3
backbone_mode: shared_batch

backbone:
  # One shared Conv/C2f/SPPF backbone processes [RGB batch; IR batch].
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

  - [4, 1, BatchSplit, []]
  - [10, 1, Select, [0]]
  - [10, 1, Select, [1]]
  - [[11, 12], 1, Add, [1]]

  - [6, 1, BatchSplit, []]
  - [14, 1, Select, [0]]
  - [14, 1, Select, [1]]
  - [[15, 16], 1, Add, [1]]

  - [9, 1, BatchSplit, []]
  - [18, 1, Select, [0]]
  - [18, 1, Select, [1]]
  - [[19, 20], 1, CrossModalDecoder, [1024, 1]]
  - [21, 1, Select, [0]]
  - [21, 1, Select, [1]]
  - [[22, 23], 1, Add, [1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 27], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 24], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[30, 33, 36], 1, Detect, [nc]]
