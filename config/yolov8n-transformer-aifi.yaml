# YOLOv8 dual-stream RGB/IR object detection with AIFI-style P5 Transformer fusion.

nc: 80
depth_multiple: 0.33
width_multiple: 0.25
ch: 3

backbone:
  # [from, repeats, module, args]
  ######### Stream Features To P3 #############
  # stream one
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  # stream two
  - [-4, 1, Conv, [64, 3, 2]] # 5-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 6-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 8-P3/8
  - [-1, 6, C2f, [256, True]]

  ######### P3 Lightweight Fusion #############
  - [[4,9], 1, AIFIConv, [256]]       # 10-P3/8 deltas
  - [[4,10], 1, Add2, [256,0]]        # 11-P3/8 stream one x + delta[0]
  - [[9,10], 1, Add2, [256,1]]        # 12-P3/8 stream two x + delta[1]

  ######### Stream Features To P4 #############
  # stream one
  - [11, 1, Conv, [512, 3, 2]] # 13-P4/16
  - [-1, 6, C2f, [512, True]]
  # stream two
  - [12, 1, Conv, [512, 3, 2]] # 15-P4/16
  - [-1, 6, C2f, [512, True]]

  ######### P4 Lightweight Fusion #############
  - [[14,16], 1, AIFIConv, [512]]      # 17-P4/16 deltas
  - [[14,17], 1, Add2, [512,0]]        # 18-P4/16 stream one x + delta[0]
  - [[16,17], 1, Add2, [512,1]]        # 19-P4/16 stream two x + delta[1]

  ######### Stream Features To P5 #############
  # stream one
  - [18, 1, Conv, [1024, 3, 2]] # 20-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 22
  # stream two
  - [19, 1, Conv, [1024, 3, 2]] # 23-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 25

  ######### P5 8x8 Transformer Fusion #############
  - [[22,25], 1, AIFIGPT, [1024, 1, True]]   # 26-P5/32 deltas, n_layer=1, avgpool=True
  - [[22,26], 1, Add2, [1024,0]]       # 27-P5/32 stream one x + trans[0]
  - [[25,26], 1, Add2, [1024,1]]       # 28-P5/32 stream two x + trans[1]

  ######### Add Block #############
  - [[11,12], 1, Add, [1]]   # 29-P3/8 fusion backbone P3
  - [[18,19], 1, Add, [1]]   # 30-P4/16 fusion backbone P4
  - [[27,28], 1, Add, [1]]   # 31-P5/32 fusion backbone P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 30], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 34

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 29], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 37 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 34], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 40 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 31], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 43 (P5/32-large)

  - [[37, 40, 43], 1, Detect, [nc]] # Detect(P3, P4, P5)
